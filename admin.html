<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>amona 更新管理</title><link rel="icon" href="favicon.ico">
<style>
:root{--ink:#40332e;--rose:#bd7180;--cream:#f8f2ee;--line:#e8ddd6;--green:#568474}*{box-sizing:border-box}body{margin:0;background:#fbf8f6;color:var(--ink);font-family:"Yu Gothic",system-ui,sans-serif}header{display:flex;align-items:center;gap:18px;padding:18px 5vw;background:#fff;border-bottom:1px solid var(--line)}header b{font:28px Georgia,serif;letter-spacing:.08em}header span{font-size:13px;color:#796a63}header button{margin-left:auto}.wrap{width:min(1040px,92%);margin:28px auto 70px}.card{margin-bottom:22px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px rgba(70,48,40,.07)}h1{font-size:22px;margin:0 0 18px}h2{font-size:18px;margin:0 0 16px}.notice{padding:13px;border-radius:10px;background:#fff5df;color:#745516;font-size:13px;line-height:1.7}.ok{background:#eaf5ef;color:#315e4f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}textarea{min-height:92px;resize:vertical}button{border:1px solid var(--line);border-radius:10px;padding:11px 16px;background:#fff;cursor:pointer;font-weight:700}.primary{background:var(--rose);border-color:var(--rose);color:#fff}.danger{color:#a13f4b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.image-list{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.image-item{padding:12px;border:1px solid var(--line);border-radius:12px}.image-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--cream)}.image-item strong{display:block;margin:8px 0;font-size:13px}.coupon-list{display:grid;gap:10px;margin-top:20px}.coupon-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px}.coupon-row b,.coupon-row small{display:block}.coupon-row small{margin-top:5px;color:#786963}.status{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:#eaf5ef;color:#315e4f;font-size:10px}.status.off{background:#eee;color:#666}[hidden]{display:none!important}@media(max-width:700px){.grid,.image-list{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:18px}.coupon-row{grid-template-columns:1fr}.coupon-row .actions{margin-top:0}}
.image-list{grid-template-columns:repeat(2,1fr);gap:16px}.image-item{position:relative;padding:14px;border-radius:14px}.image-item img{border-radius:9px}.image-item strong{margin:10px 0 5px;font-size:15px}.image-number{position:absolute;top:22px;left:22px;z-index:1;padding:5px 10px;border-radius:999px;background:rgba(64,51,46,.84);color:#fff;font-size:11px;font-weight:700}.image-place{min-height:40px;color:#574943;font-size:12px;line-height:1.65}.image-size{margin:7px 0 11px;color:#8a746a;font-size:11px}.image-upload{display:block;padding:11px 13px;border-radius:9px;background:var(--rose);color:#fff;text-align:center;font-size:13px;font-weight:700;cursor:pointer}.image-upload input{display:none}.image-help{display:block;margin-top:7px;color:#8a746a;font-size:10px;line-height:1.5}@media(max-width:700px){.image-list{grid-template-columns:1fr}.image-place{min-height:0}}
</style></head><body><header><b>amona</b><span>更新管理</span><button id="logout" hidden>ログアウト</button></header><main class="wrap">
<section class="card" id="setupNotice" hidden><h1>初期設定が必要です</h1><p class="notice">cms-config.js にSupabaseのProject URLとanon public keyを入力してください。詳しい手順は同梱の「無料管理システム_初期設定手順.txt」をご覧ください。</p></section>
<section class="card" id="loginCard"><h1>管理者ログイン</h1><form id="loginForm" class="grid"><div class="field full"><label>メールアドレス</label><input id="email" type="email" autocomplete="username" required></div><div class="field full"><label>パスワード</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="primary">ログイン</button></div></form><p id="loginMessage"></p></section>
<div id="adminArea" hidden>
<section class="card"><h2>サイト画像を更新</h2><p class="notice ok">画像は選択するとすぐに公開用へ保存されます。推奨形式：JPEG・PNG・WebP、8MB以内。</p><div class="image-list" id="imageList"></div></section>
<section class="card"><h2 id="couponFormTitle">クーポンを追加</h2><form id="couponForm" class="grid"><input id="couponId" type="hidden"><div class="field"><label>対象</label><select id="customerType"><option value="new">新規</option><option value="repeat">再来</option><option value="all">全員</option></select></div><div class="field"><label>表示順</label><input id="sortOrder" type="number" value="0"></div><div class="field full"><label>見出しタグ</label><input id="tag" placeholder="人気No.1"></div><div class="field full"><label>クーポン名</label><input id="couponTitle" required></div><div class="field"><label>価格</label><input id="price" placeholder="¥12,000" required></div><div class="field"><label>公開状態</label><select id="isActive"><option value="true">公開</option><option value="false">非公開</option></select></div><div class="field full"><label>説明</label><textarea id="description"></textarea></div><div class="field full"><label>予約先URL</label><input id="reserveUrl" type="url" placeholder="https://..."></div><div class="field full actions"><button class="primary" type="submit">保存する</button><button id="couponCancel" type="button">入力をクリア</button></div></form><div class="coupon-list" id="couponList"></div></section>
</div></main><script src="cms-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=20260921-3"></script></body></html>
