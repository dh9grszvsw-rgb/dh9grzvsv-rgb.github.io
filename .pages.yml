media:
  input: images/blog
  output: /images/blog
  rename: safe
  categories: [image]

content:
  - name: blog
    label: お知らせ・ブログ
    type: file
    path: blog-data.json
    format: json
    list: true
    fields:
      - { name: id, label: 記事ID（半角英数字）, type: string, required: true }
      - { name: published, label: 公開する, type: boolean, default: true }
      - { name: date, label: 公開日, type: date, required: true }
      - name: category
        label: カテゴリー
        type: select
        options:
          values: [お知らせ, ヘアケア, スタイル, キャンペーン]
        required: true
      - { name: title, label: タイトル, type: string, required: true }
      - { name: summary, label: 一覧用の短い説明, type: text, required: true }
      - { name: image, label: メイン写真（Instagram投稿では不要）, type: image, required: false }
      - { name: body, label: 本文（Instagram投稿では任意）, type: text, required: false }
      - { name: instagram_url, label: Instagram投稿URL（任意）, type: string, required: false, description: Instagramの投稿またはリールのURLを貼り付けてください }
